apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: default
  labels:
    app.kubernetes.io/name: web-app
    app.kubernetes.io/instance: web-app-v1
    app.kubernetes.io/component: frontend-server
    app.kubernetes.io/part-of: task-12-k8s-platform
    app.kubernetes.io/managed-by: kubectl
spec:
  # Expose deployment externally to host browser via NodePort
  type: NodePort
  selector:
    # Strictly maps to the labels defined on app-deployment pods
    app.kubernetes.io/name: web-app
    app.kubernetes.io/instance: web-app-v1
    app.kubernetes.io/component: frontend-server
  ports:
    - name: http
      port: 80           # Virtual cluster overlay port (ClusterIP)
      targetPort: 80     # Container port where Nginx is listening
      nodePort: 30088    # Static port exposed across all cluster node interfaces
      protocol: TCP
