apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-nginx-deployment
  namespace: default
  labels:
    app.kubernetes.io/name: sample-nginx
    app.kubernetes.io/instance: sample-nginx-v1
    app.kubernetes.io/component: web-server
    app.kubernetes.io/part-of: reference-workload
    app.kubernetes.io/managed-by: kubectl
spec:
  # Enforce high availability across failure domains with 2 active replicas
  replicas: 2
  # Zero-downtime rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Allow 1 extra pod during rollout (total max 3)
      maxUnavailable: 0  # Ensure 2 pods remain ready during updates
  # Immutable selector contract: must strictly match template labels
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-nginx
      app.kubernetes.io/instance: sample-nginx-v1
      app.kubernetes.io/component: web-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-nginx
        app.kubernetes.io/instance: sample-nginx-v1
        app.kubernetes.io/component: web-server
    spec:
      containers:
        - name: nginx-web
          image: nginx:1.25.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # Baseline compute governance & cgroup quota allocation
          resources:
            requests:
              cpu: "100m"      # Guaranteed minimum: 0.1 CPU core
              memory: "64Mi"    # Guaranteed minimum: 64 Mebibytes
            limits:
              cpu: "250m"      # Hard CFS quota ceiling: 0.25 CPU core
              memory: "128Mi"   # Hard OOM killer threshold: 128 Mebibytes
          # Kubelet probe lifecycle: service traffic admission gating
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          # Kubelet probe lifecycle: deadlock detection and container restart
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
